name: Android APK

# Builds an installable APK. Run it by hand (Actions → Android APK → Run workflow), or push a tag like v1.0.0 to also publish
# the APK as a GitHub Release that anybody can download on their phone.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo prebuild -p android --no-install
      - name: Build
        working-directory: frontend/android
        run: ./gradlew app:assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64 --no-daemon
        env:
          NODE_ENV: production
          EXPO_PUBLIC_SERVER_URL: https://codenames-pulp-api.onrender.com
      - run: cp android/app/build/outputs/apk/release/app-release.apk codenames-pulp.apk
      - uses: actions/upload-artifact@v4
        with:
          name: codenames-pulp-apk
          path: frontend/codenames-pulp.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: codenames-pulp-apk
      - run: gh release create "$GITHUB_REF_NAME" codenames-pulp.apk --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
