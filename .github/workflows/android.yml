name: Android APK

# Builds an installable APK. Run it by hand (Actions → Android APK → Run workflow), or push a tag like v1.0.0 to also publish
# the APK as a GitHub Release that anybody can download on their phone.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo prebuild -p android --no-install
      # Decode the persistent release keystore so every release is signed with the same key and
      # installs as an update over the previous one, instead of the template's debug keystore
      # (which Android would treat as a different, conflicting app). If the secret is ever empty
      # the file ends up empty too; the Gradle plugin then falls back to the debug keystore.
      - name: Decode release keystore
        working-directory: frontend/android/app
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      # One small APK per processor type instead of one big one with every type inside.
      - name: Build
        working-directory: frontend/android
        run: |
          mkdir -p ../out
          for abi in arm64-v8a armeabi-v7a; do
            ./gradlew app:assembleRelease -PreactNativeArchitectures=$abi --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../out/codenames-pulp-$abi.apk
          done
          ls -l ../out
        env:
          NODE_ENV: production
          EXPO_PUBLIC_SERVER_URL: https://codenames-pulp-api.onrender.com
          RELEASE_KEYSTORE_PATH: release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: codenames-pulp-apk
          path: frontend/out/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: codenames-pulp-apk
      - run: |
          cat > notes.md <<'EOF'
          **Android:** download **codenames-pulp-arm64-v8a.apk** (almost every phone from 2017 on).
          Only very old phones need **codenames-pulp-armeabi-v7a.apk**. Open the file to install.
          (`codenames-pulp.apk` is the same as the arm64 file, for older links.)
          Phones that already have the app are offered the update when they open it.
          EOF
          # Same file under the old name, so .../releases/latest/download/codenames-pulp.apk links keep working.
          cp codenames-pulp-arm64-v8a.apk codenames-pulp.apk
          gh release create "$GITHUB_REF_NAME" codenames-pulp-*.apk codenames-pulp.apk --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
